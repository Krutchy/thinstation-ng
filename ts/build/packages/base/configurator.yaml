package:
  name: "base"
  category: "Utilities"
  priority: 10
  has-sessions: false
  visible: true
  dependencies:
    - "terminfo"
    - "busybox-shared"
    - "kmod"
    - "systemd"
    - "base-nss"
    - "bash"
    - "crypto-policies"
    - "libbpf"

options:
  - name: "AUDIO_LEVEL"
    description: "Audio Level for sound."
    type: "range"
    min: 0
    max: 100
    step: 1
    default: 50

  - name: "MIC_LEVEL"
    description: "Recording level for input devices."
    type: "range"
    min: 0
    max: 100
    step: 1
    default: 50

  - name: "LOCALE"
    description: "If multiple locales are included in the image, you can use this to select one during boot with a .conf file."
    type: "text"
    default: ""

  - name: "TIME_ZONE"
    description: "Used to set time zone on a TS client with a zone info file. If multiple zone-info files are included, this selection can be refined with additional .conf files."
    type: "text"
    default: "America/Los_Angeles"

  - name: "SYSLOG_SERVER"
    description: "Log server ip address or hostname. If not specified syslogd is not loaded. Using 'local' logs locally."
    type: "text"
    default: "local"
    
  - name: "USB_STORAGE_SYNC"
    description: "Use safer writing to USB storage devices. Turning this off makes writing faster, but may lead to data corruption if the device is unplugged before buffers have been flushed."
    type: "boolean"
    true_value: "ON"
    false_value: "OFF"
    default: true

  - name: "USB_MOUNT_DIR"
    description: "Directory to use for mounting usbdisks."
    type: "text"
    default: "/mnt/usbdevice/"

  - name: "USB_MOUNT_USELABEL"
    description: "How to label individual USB disks. By default, disks are labeled with their device name. Using 'NO' will use the default, and 'YES' will search the USB volume for a label and use it, or else use the default. Any other value will also search the USB volume but use that value if no label is found."
    type: "Text"
    default: "NO"

  - name: "DISK_STORAGE_SYNC"
    description: "Turn ON for safer writing, turn OFF for faster writes to USB storage devices. **WARNING: This may lead to data corruption when the device is unplugged before buffers have been flushed.**"
    type: "boolean"
    true_value: "ON"
    false_value: "OFF"
    default: false

  - name: "USB_MOUNT_OPTIONS"
    description: "Additional mount options for disk devices."
    type: "text"
    default: "local"

  - name: "DISK_MOUNT_OPTIONS"
    description: "Additional mount options for disk devices (eg. utf8,shortname=win95). Details can be found in mount documentation for details (enter 'man mount' in the terminal)."
    type: "text"
    default: null

  - name: "CDROM_MOUNT_OPTIONS"
    description: "Additional mount options for cdrom devices (eg. utf8,shortname=win95). Details can be found in mount documentation for details (enter 'man mount' in the terminal)."
    type: "text"
    default: null

  - name: "BIND_MOUNT#"
    description: "A disk label to bind mount point mapping (eg. boot:/boot or home:/root)."
    type: "text"
    repeatable: true
    start: 0
    limit: 10

  - name: "MENU_SHOWSETTINGS"
    description: "Display Settings item in start menu."
    type: "boolean"
    default: false

  - name: "DAILY_REBOOT"
    description: "Reboots server after 24 hours if any sessions have been closed."
    type: "boolean"
    true_value: "On"
    false_value: "Off"
    default: false

  - name: "CUSTOM_CONFIG"
    description: "What to do when all sessions have exited and not reconnected."
    type: "boolean"
    true_value: "On"
    false_value: "Off"
    default: false

  - name: "RECONNECT_PROMPT"
    description: "Prompt user to reconnect when a session ends?"
    type: "list"
    options:
      - "OFF:Reconnect prompt will be displayed."
      - "ON:No reconnect prompt."
      - "FORCE:Just reconnect."
      - "AUTO:Automatic reconnect."
      - "AUTOXX:Automatic reconnect attempt after XX seconds - msg is displayed."
      - "MENU:Shows a menu with a shutdown and reconnection option."
      - "MENUXX:Shows a menu, but shuts down after XX minutes if reconnection never selected."
    default: "OFF"
    
  - name: "NO_SESSION"
    description: "What to do in the event that all sessions have exited and not reconnected."
    type: "list"
    options:
      - "REBOOT:Shutdown the terminal."
      - "POWEROFF:Reboot the terminal."
    default: "REBOOT"

  - name: "DEBUGPAUSE"
    description: "Will pause at prompt after load of all modules and packages but before starting. Only works if 'debug' package included."
    type: "boolean"
    default: false

  - name: "FASTBOOT_URL"
    description: "Normally fastboot will try to load lib.squash in the same way that vmlinuz and initrd were loaded. This will force fastboot to download lib.squash using a specific protocol and location."
    type: "text"
    default: ""

  - name: "AUTOSTART"
    description: "Run applications at startup?"
    type: "boolean"
    true_value: "ON"
    false_value: "OFF"
    default: false

  - name: "ICONMODE"
    description: "Create default sessions in window manager/idesk or wbar?"
    type: "boolean"
    true_value: "AUTO"
    false_value: "MANUAL"
    default: true

  - name: "ALWAYS_ENTER_SERVER"
    description: "Whether or not the server entry dialog box is always displayed."
    type: "boolean"
    true_value: "ON"
    false_value: "OFF"
    default: true

  - name: "ALLOW_EXIT"
    description: "Whether or not a user will be allowed to cancel the server address entry."
    type: "boolean"
    true_value: "ON"
    false_value: "OFF"
    default: false

  - name: "STORAGE_PATH"
    description: "Path to where storage device is mounted to save profile settings."
    type: "list"
    options:
      - "/mnt/usbdevice/sdX/partX"
      - "/mnt/floppy"
      - "/mnt/disc/hdX/partX"
      - "/mnt/nfs"
      - "/mnt/smb"

  - name: "STORAGE_PREFIX"
    description: "This is the prefix for the folder name to store settings in on the storage device. You can also use one of the special characters below:\nM = Mac Address\nH = Hostname\nI = Ip Address"
    type: "text"
    default: ".profile"

  - name: "STORAGE_CONFIG#"
    description: "A disk label to bind mount point mapping (eg. boot:/boot or home:/root)."
    type: "text"
    repeatable: true
    start: 1
    limit: 8